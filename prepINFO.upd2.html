<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Информатика · Тренажёр для подготовки к ОГЭ и ЕГЭ</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --bg:#f5f7fc; --card:#fff; --ink:#0f1a33; --muted:#64708c;
    --line:#e3e8f2; --line-strong:#cdd7ea;
    --primary:#3b5bdb; --primary-dark:#2b47b8; --primary-soft:#eaf0ff;
    --purple:#7048e8; --purple-soft:#f1ecff;
    --ok:#0a9e64; --ok-soft:#e3f8ee;
    --err:#d1374a; --err-soft:#fdecee;
    --warn:#d98220; --warn-soft:#fdf3e2;
    --radius:16px; --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(15,26,51,.06), 0 4px 12px rgba(15,26,51,.05);
    --shadow-md:0 2px 4px rgba(15,26,51,.06), 0 12px 32px rgba(15,26,51,.08);
  }
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(112,72,232,.07), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(59,91,219,.09), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink); line-height:1.6;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100vh;
  }
  .wrap{width:100%; max-width:1000px; margin:0 auto; padding:0 20px}

  /* ---------- Шапка ---------- */
  .topbar{
    background:rgba(255,255,255,.85);
    backdrop-filter:saturate(160%) blur(12px);
    -webkit-backdrop-filter:saturate(160%) blur(12px);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:30;
  }
  .topbar .wrap{display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding-top:12px; padding-bottom:12px; min-height:64px}
  .logo{
    background:none; border:0; padding:0; cursor:pointer; font:inherit;
    font-size:18px; font-weight:800; color:var(--ink); letter-spacing:-.02em;
    display:flex; align-items:center; gap:10px; text-align:left;
  }
  .logo-mark{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:10px;
    background:linear-gradient(135deg,#3b5bdb,#7048e8); color:#fff;
    font-size:17px; box-shadow:0 4px 12px rgba(59,91,219,.35);
  }
  .logo small{display:block; font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; line-height:1}
  .crumbs{font-size:13px; color:var(--muted); margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .crumb-link{color:var(--primary); cursor:pointer; text-decoration:none; font-weight:600; transition:.15s}
  .crumb-link:hover{color:var(--primary-dark)}
  .crumbs b{color:var(--ink); font-weight:600}
  .crumbs .sep{color:var(--line-strong)}

  /* ---------- Пользователь в шапке ---------- */
  .user-area{position:relative; flex-shrink:0}
  .btn-login{
    font:inherit; font-size:14px; font-weight:700; cursor:pointer;
    background:linear-gradient(135deg,#3b5bdb,#4f7cf0); color:#fff;
    border:0; border-radius:10px; padding:9px 18px;
    display:inline-flex; align-items:center; gap:7px;
    box-shadow:0 4px 12px rgba(59,91,219,.25); transition:.18s;
  }
  .btn-login:hover{transform:translateY(-1px); box-shadow:0 6px 16px rgba(59,91,219,.35)}
  .user-btn{
    display:flex; align-items:center; gap:9px; cursor:pointer;
    font:inherit; font-size:14px; font-weight:600; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:11px;
    padding:6px 12px 6px 6px; transition:.18s;
  }
  .user-btn:hover{border-color:var(--line-strong); box-shadow:var(--shadow-sm)}
  .user-avatar{
    width:30px; height:30px; border-radius:8px;
    background:linear-gradient(135deg,#3b5bdb,#7048e8); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:14px;
  }
  .user-name{max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .user-caret{color:var(--muted); font-size:11px; transition:.2s}
  .user-area.open .user-caret{transform:rotate(180deg)}
  .user-dropdown{
    display:none; position:absolute; right:0; top:calc(100% + 8px);
    background:#fff; border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow-md); min-width:200px; padding:6px; z-index:40;
    animation:dropIn .18s ease;
  }
  @keyframes dropIn{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:translateY(0)}}
  .user-area.open .user-dropdown{display:block}
  .dropdown-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    font:inherit; font-size:14px; font-weight:600; color:var(--ink);
    background:none; border:0; border-radius:8px; padding:10px 12px; cursor:pointer;
    transition:.15s;
  }
  .dropdown-item:hover{background:var(--primary-soft); color:var(--primary)}
  .dropdown-item.danger:hover{background:var(--err-soft); color:var(--err)}
  .dropdown-sep{height:1px; background:var(--line); margin:4px 6px}

  /* ---------- Общее ---------- */
  main{flex:1; padding:32px 0 56px}
  h1.page-title{font-size:clamp(22px,3.5vw,30px); margin:0 0 8px; line-height:1.2; letter-spacing:-.02em}
  .lead{color:var(--muted); margin:0 0 24px; font-size:15.5px; max-width:720px}
  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow-sm);
    padding:22px 24px; margin-bottom:18px;
  }
  .card h3{
    margin:0 0 14px; font-size:12.5px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--primary); font-weight:800;
    display:flex; align-items:center; gap:8px;
  }
  .card h3::before{content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--primary)}

  /* ---------- Hero ---------- */
  .hero{
    position:relative; overflow:hidden;
    background:linear-gradient(135deg,#eef3ff 0%,#f8faff 50%,#f3ecff 100%);
    border:1px solid var(--line); border-radius:20px;
    padding:40px 34px; margin-bottom:26px; box-shadow:var(--shadow-sm);
  }
  .hero::before,.hero::after{content:""; position:absolute; border-radius:50%; pointer-events:none}
  .hero::before{top:-120px; right:-80px; width:340px; height:340px;
    background:radial-gradient(circle, rgba(112,72,232,.18), transparent 70%);
    animation:float 10s ease-in-out infinite}
  .hero::after{bottom:-140px; left:-60px; width:300px; height:300px;
    background:radial-gradient(circle, rgba(59,91,219,.15), transparent 70%);
    animation:float 12s ease-in-out infinite reverse}
  @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-24px,18px)}}
  .hero > *{position:relative; z-index:1}
  .hero .eyebrow{display:inline-block; font-size:11.5px; font-weight:800; letter-spacing:.12em;
    color:var(--purple); background:var(--purple-soft); border-radius:20px; padding:4px 12px; margin-bottom:14px}
  .hero h1{font-size:clamp(24px,4vw,34px); margin:0 0 12px; line-height:1.15; letter-spacing:-.025em; max-width:720px}
  .hero p{margin:0; color:var(--muted); max-width:640px; font-size:15.5px}

  /* ---------- Экзамены ---------- */
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:20px}
  .exam-card{
    position:relative; overflow:hidden; text-align:left; cursor:pointer; font:inherit; color:inherit;
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow-sm); padding:26px 24px; transition:.22s ease;
  }
  .exam-card::before{content:""; position:absolute; inset:0;
    background:linear-gradient(135deg,var(--grad-a,#eaf0ff),transparent 60%);
    opacity:.7; transition:.22s; pointer-events:none}
  .exam-card:hover{transform:translateY(-3px); border-color:var(--line-strong); box-shadow:var(--shadow-md)}
  .exam-card:hover::before{opacity:1}
  .exam-card > *{position:relative; z-index:1}
  .exam-card[data-exam="oge"]{--grad-a:#e6efff}
  .exam-card[data-exam="ege"]{--grad-a:#f1ecff}
  .exam-badge{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800;
    letter-spacing:.08em; border-radius:9px; padding:5px 11px; margin-bottom:12px; color:#fff}
  .exam-card[data-exam="oge"] .exam-badge{background:linear-gradient(135deg,#3b5bdb,#4f7cf0)}
  .exam-card[data-exam="ege"] .exam-badge{background:linear-gradient(135deg,#7048e8,#8a63f0)}
  .exam-card h2{margin:0 0 6px; font-size:20px; letter-spacing:-.01em}
  .exam-card p{margin:0; color:var(--muted); font-size:14px}
  .exam-card .arrow{position:absolute; top:24px; right:24px; color:var(--line-strong);
    font-size:22px; transition:.22s}
  .exam-card:hover .arrow{color:var(--primary); transform:translateX(4px)}

  /* ---------- How ---------- */
  .how ol{margin:0; padding:0; list-style:none; counter-reset:step}
  .how li{counter-increment:step; position:relative; padding:12px 0 12px 44px;
    color:var(--muted); border-bottom:1px solid var(--line); font-size:14.5px}
  .how li:last-child{border-bottom:0; padding-bottom:0}
  .how li::before{content:counter(step); position:absolute; left:0; top:11px;
    width:28px; height:28px; border-radius:9px; background:var(--primary-soft); color:var(--primary);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px}

  /* ---------- Темы ---------- */
  .topic-list{display:flex; flex-direction:column; gap:12px}
  .topic-card{
    display:flex; align-items:center; gap:16px; width:100%; text-align:left;
    cursor:pointer; font:inherit; color:inherit;
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow-sm); padding:16px 20px; transition:.2s ease;
  }
  .topic-card:hover{border-color:var(--line-strong); transform:translateX(3px); box-shadow:var(--shadow-md)}
  .topic-icon{flex:0 0 46px; height:46px; border-radius:12px;
    background:linear-gradient(135deg,var(--primary-soft),#f1ecff);
    display:flex; align-items:center; justify-content:center; font-size:22px}
  .topic-body{display:flex; flex-direction:column; min-width:0}
  .topic-body b{font-size:15.5px; font-weight:700; letter-spacing:-.01em}
  .topic-body small{color:var(--muted); font-size:13px; margin-top:2px}
  .topic-right{margin-left:auto; display:flex; align-items:center; gap:12px; flex-shrink:0}
  .num-badge{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:34px; height:22px; padding:0 8px; border-radius:6px;
    background:var(--purple-soft); color:var(--purple);
    font-size:12px; font-weight:800; letter-spacing:.03em; margin-right:8px;
    vertical-align:middle;
  }
  .best-badge{font-size:12px; font-weight:800; color:var(--ok);
    background:var(--ok-soft); border-radius:20px; padding:4px 11px}
  .chev{color:var(--line-strong); font-size:22px; line-height:1; font-weight:300}

  /* ---------- Формы (вход/регистрация) ---------- */
  .auth-page{max-width:440px; margin:40px auto}
  .auth-card{background:#fff; border:1px solid var(--line); border-radius:20px;
    box-shadow:var(--shadow-md); padding:32px 32px 28px}
  .auth-tabs{display:flex; background:#f0f3fa; border-radius:12px; padding:4px; margin-bottom:22px}
  .auth-tab{flex:1; font:inherit; font-size:14px; font-weight:700; color:var(--muted);
    background:none; border:0; border-radius:9px; padding:10px; cursor:pointer; transition:.18s}
  .auth-tab.active{background:#fff; color:var(--primary); box-shadow:0 2px 6px rgba(15,26,51,.08)}
  .form-field{margin-bottom:16px}
  .form-field label{display:block; font-size:13px; font-weight:700; color:var(--muted); margin-bottom:6px}
  .form-field input{
    width:100%; font:inherit; font-size:15px; padding:12px 15px;
    border:1.5px solid var(--line); border-radius:11px; background:#fff; outline:none; transition:.16s;
  }
  .form-field input:focus{border-color:var(--primary); box-shadow:0 0 0 4px var(--primary-soft)}
  .form-error{
    display:none; font-size:13.5px; font-weight:600; color:var(--err);
    background:var(--err-soft); border-radius:9px; padding:10px 14px; margin-bottom:16px;
  }
  .form-error.show{display:block}
  .auth-note{font-size:12.5px; color:var(--muted); margin-top:16px; line-height:1.5;
    padding:12px 14px; background:#f7f9fd; border-radius:10px; border:1px dashed var(--line-strong)}
  .auth-card .btn{width:100%; padding:13px; font-size:15px}

  /* ---------- Кабинет ---------- */
  .cabinet-header{display:flex; align-items:center; gap:20px; padding:26px 26px;
    background:linear-gradient(135deg,#eef3ff 0%,#f8faff 50%,#f3ecff 100%);
    border:1px solid var(--line); border-radius:20px; margin-bottom:22px; box-shadow:var(--shadow-sm)}
  .cabinet-avatar{flex:0 0 72px; height:72px; border-radius:20px;
    background:linear-gradient(135deg,#3b5bdb,#7048e8); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:30px; font-weight:800; box-shadow:0 8px 24px rgba(59,91,219,.3)}
  .cabinet-info h1{margin:0 0 4px; font-size:22px; letter-spacing:-.02em}
  .cabinet-info p{margin:0; color:var(--muted); font-size:14px}
  .stats-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px}
  .stat-card{background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:18px 16px; box-shadow:var(--shadow-sm)}
  .stat-card .stat-label{font-size:12px; font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px}
  .stat-card .stat-value{font-size:26px; font-weight:800; letter-spacing:-.02em; line-height:1}
  .stat-card .stat-value small{font-size:14px; font-weight:600; color:var(--muted)}
  .stat-card.ok .stat-value{color:var(--ok)}
  .stat-card.primary .stat-value{color:var(--primary)}
  .stat-card.purple .stat-value{color:var(--purple)}
  .cabinet-table{width:100%; border-collapse:collapse; font-size:14px}
  .cabinet-table th{
    text-align:left; padding:10px 12px; font-size:11.5px; font-weight:800;
    color:var(--muted); text-transform:uppercase; letter-spacing:.06em;
    border-bottom:2px solid var(--line);
  }
  .cabinet-table td{padding:12px; border-bottom:1px solid var(--line); vertical-align:middle}
  .cabinet-table tr:last-child td{border-bottom:0}
  .cabinet-table .num-cell{font-weight:800; color:var(--purple)}
  .cabinet-table .score-cell{font-weight:800}
  .cabinet-table .score-cell.high{color:var(--ok)}
  .cabinet-table .score-cell.mid{color:var(--warn)}
  .cabinet-table .score-cell.low{color:var(--err)}
  .cabinet-table .empty{color:var(--muted); font-style:italic; font-size:13px}
  .cabinet-actions{display:flex; gap:12px; flex-wrap:wrap; margin-top:8px}
  .empty-state{text-align:center; padding:40px 20px; color:var(--muted)}
  .empty-state .big{font-size:48px; margin-bottom:12px}
  .empty-state p{margin:0 0 20px}

  /* ---------- Прогресс ---------- */
  .progress-row{display:flex; align-items:center; gap:16px; margin:26px 0 16px}
  .progress{flex:1; height:10px; background:#e6ebf6; border-radius:99px; overflow:hidden; position:relative}
  .progress-bar{height:100%; width:0; border-radius:99px;
    background:linear-gradient(90deg,#4d7bf0,#3b5bdb); transition:width .35s cubic-bezier(.4,0,.2,1);
    box-shadow:0 0 12px rgba(59,91,219,.4)}
  .progress-text{font-size:13px; font-weight:700; color:var(--muted); white-space:nowrap}

  /* ---------- Задания ---------- */
  .task{padding:22px 24px; transition:.2s}
  .task.checked{border-color:var(--line-strong)}
  .task-head{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap}
  .task-num{width:30px; height:30px; border-radius:9px;
    background:linear-gradient(135deg,var(--primary-soft),#e0e8ff);
    color:var(--primary); display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:13.5px}
  .task-points{font-size:12px; font-weight:700; color:var(--muted);
    background:#f2f5fb; border-radius:20px; padding:3px 11px}
  .task-q{margin:0 0 14px; font-size:15.5px; font-weight:500; line-height:1.55}
  pre.code{background:#f7f9fd; border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin:0 0 16px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13.5px; overflow-x:auto; white-space:pre; color:#243b6b; line-height:1.55}
  .options{display:flex; flex-direction:column; gap:9px}
  .opt{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    cursor:pointer; font:inherit; font-size:14.5px; color:inherit;
    background:#fff; border:1.5px solid var(--line); border-radius:11px;
    padding:11px 15px; transition:.16s ease}
  .opt:hover:not(:disabled){border-color:#b9cbf5; background:#fafcff}
  .opt-key{flex:0 0 24px; height:24px; border-radius:7px;
    background:#f2f5fb; color:var(--muted); font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center; transition:.16s}
  .opt.selected{border-color:var(--primary); background:var(--primary-soft)}
  .opt.selected .opt-key{background:var(--primary); color:#fff}
  .opt.is-correct{border-color:var(--ok); background:var(--ok-soft)}
  .opt.is-correct .opt-key{background:var(--ok); color:#fff}
  .opt.is-wrong{border-color:var(--err); background:var(--err-soft)}
  .opt.is-wrong .opt-key{background:var(--err); color:#fff}
  .opt:disabled{cursor:default}
  .input-wrap{margin-bottom:4px}
  .answer-input{width:100%; max-width:360px; font:inherit; font-size:15px;
    padding:12px 15px; border:1.5px solid var(--line); border-radius:11px;
    background:#fff; outline:none; transition:.16s}
  .answer-input:focus{border-color:var(--primary); box-shadow:0 0 0 4px var(--primary-soft)}
  .answer-input.is-correct{border-color:var(--ok); background:var(--ok-soft)}
  .answer-input.is-wrong{border-color:var(--err); background:var(--err-soft)}
  .task-foot{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:16px}
  .feedback{font-size:14px; font-weight:700}
  .feedback.ok{color:var(--ok)}
  .feedback.err{color:var(--err)}
  .feedback.hint{color:var(--muted); font-weight:500}

  /* ---------- Решение ---------- */
  .solution{margin-top:16px; border-radius:12px; overflow:hidden;
    border:1px solid #e0e8ff; background:linear-gradient(180deg,#f6f9ff,#fbfcff);
    animation:slideDown .35s ease}
  @keyframes slideDown{from{opacity:0; transform:translateY(-6px)}to{opacity:1; transform:translateY(0)}}
  .solution-head{display:flex; align-items:center; gap:10px;
    padding:12px 16px; font-weight:800; font-size:13.5px;
    color:var(--primary-dark); border-bottom:1px solid #e0e8ff;
    background:#eef3ff; letter-spacing:.02em}
  .solution-body{padding:14px 18px 16px}
  .solution-step{display:flex; gap:12px; padding:7px 0; font-size:14.5px; line-height:1.55; color:#2c3e66}
  .solution-step + .solution-step{border-top:1px dashed #e0e8ff}
  .solution-step-num{flex:0 0 22px; height:22px; border-radius:50%;
    background:var(--primary); color:#fff; font-size:11.5px; font-weight:800;
    display:flex; align-items:center; justify-content:center; margin-top:1px}
  .solution-final{margin-top:8px; padding:10px 14px; border-radius:9px;
    background:var(--ok-soft); color:#065f40; font-weight:700; font-size:14.5px}

  /* ---------- Кнопки ---------- */
  .btn{font:inherit; font-size:14.5px; font-weight:700; border-radius:11px;
    padding:11px 22px; cursor:pointer; border:1.5px solid transparent;
    transition:.18s ease; display:inline-flex; align-items:center; gap:8px; justify-content:center}
  .btn-primary{background:linear-gradient(135deg,#3b5bdb,#4f7cf0); color:#fff;
    box-shadow:0 4px 14px rgba(59,91,219,.28)}
  .btn-primary:hover{transform:translateY(-1px); box-shadow:0 6px 20px rgba(59,91,219,.38)}
  .btn-ghost{background:#fff; color:var(--muted); border-color:var(--line)}
  .btn-ghost:hover{border-color:var(--line-strong); color:var(--primary)}
  .btn-danger{background:#fff; color:var(--err); border-color:#f5c5cd}
  .btn-danger:hover{background:var(--err-soft)}
  .btn-check{background:var(--primary-soft); color:var(--primary);
    border-color:#c8d7fb; padding:8px 18px; font-size:13.5px}
  .btn-check:hover:not(:disabled){background:#dde8ff; border-color:#b5c8f5}
  .btn-check:disabled{opacity:.55; cursor:default}
  .actions{display:flex; gap:12px; flex-wrap:wrap; margin-top:26px}

  /* ---------- Результат ---------- */
  .result-head{text-align:center; padding:36px 24px 32px}
  .score-ring{display:block; margin:0 auto 18px}
  .result-title{font-size:20px; font-weight:800; margin:0 0 6px; letter-spacing:-.01em}
  .verdict{color:var(--muted); margin:0 auto; font-size:15px; max-width:520px; line-height:1.55}

/* =========================================================
   АВТОРИЗАЦИЯ И ХРАНИЛИЩЕ
   ========================================================= */
function hashPassword(pw){
  let h1 = 0x811c9dc5, h2 = 0x12345678;
  for (let i = 0; i < pw.length; i++){
    h1 = Math.imul(h1 ^ pw.charCodeAt(i), 0x01000193);
    h2 = Math.imul(h2 + pw.charCodeAt(i) + i, 0x9e3779b1);
  }
  return (h1 >>> 0).toString(16) + '_' + (h2 >>> 0).toString(16);
}
function getUsers(){
  try { return JSON.parse(localStorage.getItem('inf_users') || '{}'); }
  catch(e){ return {}; }
}
function saveUsers(u){ localStorage.setItem('inf_users', JSON.stringify(u)); }
function getCurrentUser(){ return localStorage.getItem('inf_current') || null; }
function setCurrentUser(u){
  if (u) localStorage.setItem('inf_current', u);
  else localStorage.removeItem('inf_current');
}
function registerUser(username, password){
  username = (username || '').trim();
  if (username.length < 2) return { ok: false, error: 'Имя должно быть не короче 2 символов' };
  if (username.length > 20) return { ok: false, error: 'Имя должно быть не длиннее 20 символов' };
  if (!/^[А-Яа-яЁёA-Za-z0-9_-]+$/.test(username)) return { ok: false, error: 'Только буквы, цифры, _ и -' };
  if ((password || '').length < 4) return { ok: false, error: 'Пароль должен быть не короче 4 символов' };
  const users = getUsers();
  const key = username.toLowerCase();
  if (Object.keys(users).some(k => k.toLowerCase() === key)) return { ok: false, error: 'Пользователь с таким именем уже существует' };
  users[key] = { name: username, hash: hashPassword(password), created: Date.now() };
  saveUsers(users);
  setCurrentUser(key);
  return { ok: true };
}
function loginUser(username, password){
  username = (username || '').trim().toLowerCase();
  const users = getUsers();
  if (!users[username]) return { ok: false, error: 'Пользователь не найден' };
  if (users[username].hash !== hashPassword(password)) return { ok: false, error: 'Неверный пароль' };
  setCurrentUser(username);
  return { ok: true };
}
function logoutUser(){ setCurrentUser(null); }
function getUserDisplayName(){
  const key = getCurrentUser();
  if (!key) return null;
  const u = getUsers()[key];
  return u ? u.name : key;
}
function getUserCreated(){
  const key = getCurrentUser();
  if (!key) return null;
  const u = getUsers()[key];
  return u ? u.created : null;
}

/* Результаты */
function getAllResults(){
  try { return JSON.parse(localStorage.getItem('inf_results') || '{}'); }
  catch(e){ return {}; }
}
function saveResults(r){ localStorage.setItem('inf_results', JSON.stringify(r)); }
function saveAttempt(topicId, score, max){
  const user = getCurrentUser();
  if (!user) return false;
  const all = getAllResults();
  if (!all[user]) all[user] = {};
  if (!all[user][topicId]) all[user][topicId] = [];
  all[user][topicId].push({ score, max, date: Date.now() });
  if (all[user][topicId].length > 20) all[user][topicId] = all[user][topicId].slice(-20);
  saveResults(all);
  return true;
}
function getUserResults(){
  const user = getCurrentUser();
  if (!user) return {};
  return getAllResults()[user] || {};
}
function getTopicStats(topicId){
  const r = getUserResults()[topicId];
  if (!r || !r.length) return null;
  const best = Math.max(...r.map(a => Math.round(a.score / a.max * 100)));
  const last = r[r.length - 1];
  return {
    attempts: r.length,
    best,
    last: Math.round(last.score / last.max * 100),
    lastDate: last.date
  };
}
function clearUserResults(){
  const user = getCurrentUser();
  if (!user) return;
  const all = getAllResults();
  delete all[user];
  saveResults(all);
}

const app = document.getElementById('app');
const crumbs = document.getElementById('crumbs');
let attempt = null;

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function normalize(s){
  return String(s).toLowerCase().replace(/,/g,'.').replace(/\s+/g,'').trim();
}
function plural(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}
function formatDate(ts){
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function formatDateOnly(ts){
  const d = new Date(ts);
  const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function renderCabinet(){
  if (!getCurrentUser()){ renderAuth('login'); return; }

  crumbs.innerHTML = `<span class="crumb-link" data-go="home">Главная</span><span class="sep">/</span><b>Личный кабинет</b>`;
  crumbs.querySelector('[data-go="home"]').onclick = renderHome;

  const name = getUserDisplayName();
  const created = getUserCreated();
  const results = getUserResults();

  // Сводная статистика
  let totalAttempts = 0, totalScore = 0, totalMax = 0, topicsWithResults = 0, bestCount = 0;
  const allTopics = [];
  ['oge','ege'].forEach(examKey => {
    DATA[examKey].topics.forEach(t => {
      const r = results[t.id] || [];
      const stats = r.length ? {
        attempts: r.length,
        best: Math.max(...r.map(a => Math.round(a.score / a.max * 100))),
        last: Math.round(r[r.length-1].score / r[r.length-1].max * 100),
        lastDate: r[r.length-1].date
      } : null;
      allTopics.push({ exam: examKey, topic: t, stats });
      if (r.length){
        topicsWithResults++;
        totalAttempts += r.length;
        const b = Math.max(...r.map(a => Math.round(a.score / a.max * 100)));
        const max = t.tasks.reduce((s, x) => s + x.points, 0);
        totalScore += Math.round(b / 100 * max);
        totalMax += max;
        if (b >= 90) bestCount++;
      }
    });
  });
  const avg = totalMax ? Math.round(totalScore / totalMax * 100) : 0;

  const sortedTopics = allTopics.sort((a, b) => {
    if (a.exam !== b.exam) return a.exam === 'oge' ? -1 : 1;
    return a.topic.num - b.topic.num;
  });

  app.innerHTML = `
    <div class="cabinet-header">
      <div class="cabinet-avatar">${esc(name.charAt(0).toUpperCase())}</div>
      <div class="cabinet-info">

        <p>В тренажёре с ${created ? formatDateOnly(created) : '—'}</p>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card primary">
        <div class="stat-label">Всего попыток</div>
        <div class="stat-value">${totalAttempts}</div>
      </div>
      <div class="stat-card purple">
        <div class="stat-label">Тем пройдено</div>
        <div class="stat-value">${topicsWithResults} <small>/ ${allTopics.length}</small></div>
      </div>
      <div class="stat-card ${avg >= 70 ? 'ok' : ''}">
        <div class="stat-label">Средний балл</div>
        <div class="stat-value">${avg}<small>%</small></div>
      </div>
      <div class="stat-card ${bestCount > 0 ? 'ok' : ''}">
        <div class="stat-label">Отличных тем</div>
        <div class="stat-value">${bestCount}</div>
      </div>
    </div>

    <section class="card">
      <h3>Результаты по темам</h3>
      ${topicsWithResults === 0 ? `
        <div class="empty-state">
          <div class="big">📚</div>
          <p>Вы ещё не проходили ни одной темы.</p>
          <button class="btn btn-primary" id="startLearning">Начать подготовку</button>
        </div>
      ` : `
        <table class="cabinet-table">
          <thead>
            <tr>
              <th>№</th>
              <th>Тема</th>
              <th>Лучший</th>
              <th>Попыток</th>
              <th>Последняя</th>
            </tr>
          </thead>
          <tbody>
            ${sortedTopics.filter(x => x.stats).map(x => `
              <tr>
                <td class="num-cell">${x.exam.toUpperCase()}-${x.topic.num}</td>
                <td>${esc(x.topic.title)}</td>
                <td class="score-cell ${x.stats.best >= 90 ? 'high' : x.stats.best >= 50 ? 'mid' : 'low'}">${x.stats.best}%</td>
                <td>${x.stats.attempts}</td>
                <td>${x.stats.last}% · ${formatDate(x.stats.lastDate)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `}
    </section>

    <div class="cabinet-actions">
      <button class="btn btn-primary" id="startLearning2">Перейти к заданиям</button>
      ${topicsWithResults > 0 ? `<button class="btn btn-danger" id="clearResults">Очистить результаты</button>` : ''}
    </div>
  `;

  document.getElementById('startLearning')?.addEventListener('click', renderHome);
  document.getElementById('startLearning2').onclick = renderHome;
  document.getElementById('clearResults')?.addEventListener('click', () => {
    if (confirm('Очистить все сохранённые результаты? Это действие необратимо.')){
      clearUserResults();
      renderCabinet();

function taskHTML(t, i){
  const codeBlock = t.code ? `<pre class="code">${esc(t.code)}</pre>` : '';
  const answerArea = t.type === 'choice'
    ? `<div class="options">
         ${t.options.map((o, j) => `

             <span class="opt-key">${String.fromCharCode(1040 + j)}</span>

           </button>`).join('')}
       </div>`
    : `<div class="input-wrap">
         <input type="text" class="answer-input" autocomplete="off" spellcheck="false" placeholder="Введите ответ">
       </div>`;

  return `
    <article class="card task" data-idx="${i}">
      <div class="task-head">
        <span class="task-num">${i + 1}</span>
        <span class="task-points">${t.points} ${plural(t.points,'балл','балла','баллов')}</span>
      </div>
      <p class="task-q">${esc(t.q)}</p>
      ${codeBlock}
      ${answerArea}
      <div class="task-foot">
        <button class="btn btn-check">Проверить</button>
        <span class="feedback" aria-live="polite"></span>
      </div>
    </article>`;
}

/* =========================================================
   ПРОВЕРКА
   ========================================================= */
function onTaskClick(e){
  const opt = e.target.closest('.opt');
  if (opt){
    const card = opt.closest('.task');
    if (card.classList.contains('checked')) return;
    card.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    const fb = card.querySelector('.feedback');
    if (fb.classList.contains('hint')){ fb.className = 'feedback'; fb.textContent = ''; }
    return;
  }
  const btn = e.target.closest('.btn-check');
  if (btn) checkTask(btn.closest('.task'));
}

function checkTask(card){
  if (card.classList.contains('checked')) return;
  const idx = +card.dataset.idx;
  const topic = DATA[attempt.exam].topics.find(t => t.id === attempt.topicId);
  const task = topic.tasks[idx];
  const fb = card.querySelector('.feedback');
  let correct = false;

  if (task.type === 'choice'){
    const sel = card.querySelector('.opt.selected');
    if (!sel){ fb.className = 'feedback hint'; fb.textContent = 'Сначала выберите вариант ответа.'; return; }
    const given = +sel.dataset.opt;
    correct = given === task.answer;
    card.querySelectorAll('.opt').forEach(o => {
      const j = +o.dataset.opt;
      if (j === task.answer) o.classList.add('is-correct');
      if (j === given && !correct) o.classList.add('is-wrong');
      o.disabled = true;
    });
  } else {
    const input = card.querySelector('.answer-input');
    const val = input.value.trim();
    if (!val){ fb.className = 'feedback hint'; fb.textContent = 'Введите ответ.'; return; }
    correct = task.answer.some(a => normalize(a) === normalize(val));
    input.disabled = true;
    input.classList.add(correct ? 'is-correct' : 'is-wrong');
  }

  card.classList.add('checked');
  card.querySelector('.btn-check').disabled = true;

  if (correct){
    fb.className = 'feedback ok';
    fb.textContent = `Верно! +${task.points} ${plural(task.points,'балл','балла','баллов')}.`;
  } else {
    const right = task.type === 'choice' ? task.options[task.answer] : task.answer[0];
    fb.className = 'feedback err';
    fb.innerHTML = `Неверно. Правильный ответ: <b>${esc(right)}</b>.`;
  }

  if (task.solution && task.solution.length){
    const sol = document.createElement('div');
    sol.className = 'solution';
    sol.innerHTML = `
      <div class="solution-head"><span>💡</span><span>Пошаговое решение</span></div>
      <div class="solution-body">
        ${task.solution.map((s, i) => `<div class="solution-step"><span class="solution-step-num">${i+1}</span><span>${s}</span></div>`).join('')}
        ${task.final ? `<div class="solution-final">${task.final}</div>` : ''}
      </div>`;
    card.querySelector('.task-foot').after(sol);
  }

  attempt.answers[idx] = { correct };
  updateProgress();
}

function updateProgress(){
  const topic = DATA[attempt.exam].topics.find(t => t.id === attempt.topicId);
  const total = topic.tasks.length;
  const done = attempt.answers.filter(Boolean).length;
  const score = topic.tasks.reduce((s, t, i) => s + (attempt.answers[i] && attempt.answers[i].correct ? t.points : 0), 0);
  const max = topic.tasks.reduce((s, t) => s + t.points, 0);
  document.getElementById('bar').style.width = (done / total * 100) + '%';
  document.getElementById('progressText').textContent =
    `${done} / ${total} · ${score} из ${max} ${plural(max,'балла','баллов','баллов')}`;
}

/* =========================================================
   РЕЗУЛЬТАТ
   ========================================================= */

  const user = getCurrentUser();

  if (pct >= 90)      { verdict = 'Отличный результат! Тема отработана уверенно — можно переходить к следующей.'; color = '#0a9e64'; }

  crumbs.innerHTML = `

  crumbs.querySelector('[data-go="home"]').onclick = renderHome;
  crumbs.querySelector('[data-go="topics"]').onclick = () => renderTopics(attempt.exam);

  const reviewHTML = topic.tasks.map((t, i) => {
    const ok = attempt.answers[i] && attempt.answers[i].correct;
    const right = t.type === 'choice' ? t.options[t.answer] : t.answer[0];
    return `
      <div class="review-item">
        <span class="review-mark ${ok ? 'ok' : 'err'}">${ok ? '✓' : '✕'}</span>
        <div class="review-body">
          <b>${i + 1}. ${esc(t.q)}</b>
          <small>Правильный ответ: <span class="ans">${esc(right)}</span></small>
          ${t.final ? `<small>${esc(t.final)}</small>` : ''}
        </div>
      </div>`;
  }).join('');

  app.innerHTML = `
    <section class="card result-head">
      <svg class="score-ring" width="180" height="180" viewBox="0 0 180 180" style="width:180px;height:180px">
        <circle cx="90" cy="90" r="80" fill="none" stroke="#e6ebf6" stroke-width="14"/>
        <circle cx="90" cy="90" r="80" fill="none" stroke="${color}" stroke-width="14"
          stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
          stroke-linecap="round" transform="rotate(-90 90 90)"
          style="transition:stroke-dashoffset .8s ease"/>
        <text x="90" y="98" text-anchor="middle" font-size="38" font-weight="800" fill="${color}">${score}</text>
        <text x="90" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#64708c">из ${max}</text>
      </svg>
      <p class="result-title">${pct}% правильных ответов · Задание ${topic.num}</p>
      <p class="verdict">${verdict}</p>
      ${saved ? `<div class="save-note" style="background:var(--ok-soft); color:#065f40">✓ Результат сохранён в личном кабинете</div>` : `<div class="save-note">💡 <a id="loginForSave">Войдите</a>, чтобы сохранить результат в личном кабинете</div>`}
    </section>

    <section class="card">
      <h3>Разбор всех заданий</h3>
      ${reviewHTML}
    </section>

    <div class="actions">
      <button class="btn btn-primary" id="retryBtn">Пройти заново</button>
      <button class="btn btn-ghost" id="toTopicsBtn">К другим темам</button>
      ${user ? `<button class="btn btn-ghost" id="toCabinetBtn">В личный кабинет</button>` : ''}
    </div>
  `;

  document.getElementById('loginForSave')?.addEventListener('click', () => renderAuth('login'));
  document.getElementById('retryBtn').onclick = () => renderTopic(attempt.exam, attempt.topicId);
  document.getElementById('toTopicsBtn').onclick = () => renderTopics(attempt.exam);
  document.getElementById('toCabinetBtn')?.addEventListener('click', renderCabinet);
}

/* =========================================================
   СТАРТ
   ========================================================= */
document.getElementById('logoBtn').onclick = renderHome;
renderUserArea();
renderHome();
</script>
</body>
</html>
